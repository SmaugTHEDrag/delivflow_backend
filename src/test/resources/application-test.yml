spring:
  datasource:
    url: jdbc:h2:mem:delivflowtest;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: none
  flyway:
    enabled: false
app:
  cors:
    allowed-origins: http://localhost:3000
  keycloak:
    base-url: http://localhost:8080
    realm: test
    issuer-uri: http://localhost:8080/realms/test
    backend-client-id: test-client
    backend-client-secret: fake-test-secret
