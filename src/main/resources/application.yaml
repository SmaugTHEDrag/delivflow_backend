spring:
  application:
    name: delivflowbackend

  # ---------------------------------------------------------------------------
  # Database (PostgreSQL) - all values from environment variables, no secrets
  # ---------------------------------------------------------------------------
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/delivflow}
    username: ${DB_USERNAME:delivflow}
    password: ${DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    # The schema is managed by Flyway (V1__init_delivflow.sql); Hibernate only
    # validates that the entity mapping matches the existing schema.
    ddl-auto: validate
    naming:
      physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration

  # ---------------------------------------------------------------------------
  # Security - OAuth2 / OpenID Connect client (Keycloak realm "delivflow")
  # ---------------------------------------------------------------------------
  # Browser-based login uses the OIDC Authorization Code Flow with a server-side
  # HTTP session. The confidential client secret is never sent to the browser;
  # it is only used by the backend when exchanging the authorization code.
  security:
    oauth2:
      client:
        registration:
          keycloak:
            provider: keycloak
            client-id: delivflow-backend
            client-secret: ${KEYCLOAK_CLIENT_SECRET:}
            authorization-grant-type: authorization_code
            scope:
              - openid
              - profile
              - email
            # Default redirect URI: http://localhost:8080/login/oauth2/code/keycloak

        provider:
          keycloak:
            issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8180/realms/delivflow}

      # JWT resource server for Bearer-token API clients (existing /api/users API).
      # Validates the signature, issuer and expiration of incoming Bearer tokens
      # against the realm's JWKS endpoint.
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8180/realms/delivflow}

  # ---------------------------------------------------------------------------
  # Session cookie (used by the OIDC login session)
  # ---------------------------------------------------------------------------
  # HttpOnly: cookie is never readable by JavaScript.
  # SameSite: Lax is safe for same-origin deployments and top-level navigations.
  #           If the frontend is a cross-origin SPA calling the backend over HTTPS,
  #           switch to same-site: none and secure: true (see .env.example).
  # Secure:  false locally (HTTP), true in production (HTTPS only).
server:
  servlet:
    session:
      cookie:
        http-only: true
        same-site: lax
        secure: ${SESSION_COOKIE_SECURE:false}

  # ---------------------------------------------------------------------------
  # Application-level configuration
  # ---------------------------------------------------------------------------
app:
  keycloak:
    base-url: ${KEYCLOAK_BASE_URL:http://localhost:8180}
    realm: ${KEYCLOAK_REALM:delivflow}
    # Backend service-account client (Client authentication + Service accounts ON).
    backend-client-id: ${KEYCLOAK_BACKEND_CLIENT_ID:delivflow-backend}
    backend-client-secret: ${KEYCLOAK_BACKEND_CLIENT_SECRET:}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173,http://localhost:5174}
  security:
    oidc:
      logout:
        post-logout-redirect-uri: ${OIDC_LOGOUT_POST_LOGOUT_REDIRECT_URI:http://localhost:8080/}

  # ---------------------------------------------------------------------------
  # Logging
  # ---------------------------------------------------------------------------
logging:
  level:
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
