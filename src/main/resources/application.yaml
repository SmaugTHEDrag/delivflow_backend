spring:
  config:
    import: optional:file:.env[.properties]
  application:
    name: delivflowbackend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/delivflow}
    username: ${DB_USERNAME:delivflow}
    password: ${DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate
    naming:
      physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8180/realms/delivflow}

app:
  keycloak:
    base-url: ${KEYCLOAK_BASE_URL:http://localhost:8180}
    realm: ${KEYCLOAK_REALM:delivflow}
    issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8180/realms/delivflow}
    backend-client-id: ${KEYCLOAK_BACKEND_CLIENT_ID:delivflow-backend}
    backend-client-secret: ${KEYCLOAK_BACKEND_CLIENT_SECRET:}
    direct-access-grant:
      enabled: ${KEYCLOAK_DIRECT_ACCESS_GRANT_ENABLED:true}
    email-verification:
      client-id: ${KEYCLOAK_EMAIL_VERIFICATION_CLIENT_ID:delivflow-frontend}
      redirect-uri: ${KEYCLOAK_EMAIL_VERIFICATION_REDIRECT_URI:http://localhost:3000/login}
      lifespan-seconds: ${KEYCLOAK_EMAIL_VERIFICATION_LIFESPAN_SECONDS:86400}
      reconciliation-interval-ms: ${KEYCLOAK_EMAIL_VERIFICATION_RECONCILIATION_INTERVAL_MS:300000}
  auth:
    refresh-cookie:
      secure: ${AUTH_REFRESH_COOKIE_SECURE:true}
      same-site: ${AUTH_REFRESH_COOKIE_SAME_SITE:Lax}
  security:
    jwt:
      audiences: ${KEYCLOAK_EXPECTED_AUDIENCES:}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173,http://localhost:5174}

logging:
  level:
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
