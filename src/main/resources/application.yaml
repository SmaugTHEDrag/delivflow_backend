spring:
  application:
    name: delivflowbackend

  # ---------------------------------------------------------------------------
  # Database (PostgreSQL) - all values from environment variables, no secrets
  # ---------------------------------------------------------------------------
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/delivflow}
    username: ${DB_USERNAME:delivflow}
    password: ${DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    # The schema is managed by Flyway (V1__init_delivflow.sql); Hibernate only
    # validates that the entity mapping matches the existing schema.
    ddl-auto: validate
    naming:
      physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration

  # ---------------------------------------------------------------------------
  # Security - Keycloak resource server
  # ---------------------------------------------------------------------------
  # Spring Security discovers the JWKS endpoint from the issuer and validates
  # the signature, issuer and expiration of every Bearer token.
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8180/realms/delivflow}

  # Authentication is fully delegated to Keycloak, so Spring Boot must not
  # create its default in-memory user (and log a random password).
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration

# ---------------------------------------------------------------------------
# Security - Keycloak proxy endpoints (/api/auth/*)
# ---------------------------------------------------------------------------
# Backend -> Keycloak intermediary: password grant, refresh, logout and user
# registration (Admin API via the backend client's service account). All values
# come from environment variables - never hardcoded.
app:
  keycloak:
    base-url: ${KEYCLOAK_BASE_URL:http://localhost:8180}
    realm: ${KEYCLOAK_REALM:delivflow}
    # Client used for password / refresh grants (the public frontend client).
    client-id: ${KEYCLOAK_CLIENT_ID:delivflow-frontend}
    # Only needed if that client is confidential; leave empty for a public client.
    client-secret: ${KEYCLOAK_CLIENT_SECRET:}
    # Backend service-account client (Client authentication + Service accounts ON).
    backend-client-id: ${KEYCLOAK_BACKEND_CLIENT_ID:delivflow-backend}
    backend-client-secret: ${KEYCLOAK_BACKEND_CLIENT_SECRET:}

# ---------------------------------------------------------------------------
# CORS - explicit frontend origins, comma separated
# ---------------------------------------------------------------------------
app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173,http://localhost:5174}

logging:
  level:
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
